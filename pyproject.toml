[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feynman"
version = "0.2.0"
description = "An authoring system for interactive technical explanations: a Python-native static generator with build-time math, code execution, and step-driven visualisations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "latex2mathml>=3.77",
    "pygments>=2.17",
    "jinja2>=3.1",
    "nbclient>=0.9",
    "nbformat>=5.9",
    "ipykernel>=6.29",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Used by example documents, not by the core generator.
demo = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
feynman = "feynman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feynman = ["assets/*.html.j2", "assets/*.css", "assets/*.js"]
