[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feynman"
version = "0.2.0"
description = "An authoring system for interactive technical explanations: a Python-native static generator with build-time math, code execution, and step-driven visualisations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "markdown-it-py>=3",
    "mdit-py-plugins>=0.4",
    "latex2mathml>=3.77",
    "pygments>=2.17",
    "jinja2>=3.1",
    "nbclient>=0.9",
    "nbformat>=5.9",
    "ipykernel>=6.29",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Used by example documents, not by the core generator.
demo = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
feynman = "feynman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The bundled svg-canvas editor (git submodule at src/feynman/editor) ships as
# data, not an importable package. Its js/ dir is flat, so explicit one-level
# globs suffice -- no recursive ** (which would need setuptools>=62.3). If the
# editor ever grows nested asset dirs, switch to "editor/**/*" and bump the
# build requirement. README and _verify_import.py are intentionally omitted.
feynman = [
    "assets/*.html.j2",
    "assets/*.css",
    "assets/*.js",
    "editor/index.html",
    "editor/styles.css",
    "editor/LICENSE",
    "editor/js/*.js",
]
