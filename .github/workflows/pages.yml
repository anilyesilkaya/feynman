name: Deploy site to GitHub Pages

# Builds the examples/ folder with feynman and publishes the result to Pages.
# `build-all` emits each post plus a searchable index.html listing at the site
# root. The build runs Python cells (matplotlib) at build time, so we install
# the package with its `demo` extra rather than committing any generated HTML.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install feynman (with demo extras)
        run: |
          python -m pip install --upgrade pip
          pip install ".[demo]"

      - name: Build site
        run: |
          feynman build-all examples -o _site --title "feynman"
          # build-all already writes _site/index.html (the search/listing page),
          # which Pages serves at the site root -- no cp needed.
          # Custom domain: emitted into the artifact so it survives every
          # deploy (an Actions deploy would otherwise drop the Pages CNAME).
          echo "feynman.yesilkaya.dev" > _site/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
